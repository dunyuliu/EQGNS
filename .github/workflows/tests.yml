name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU torch + PyG
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric==2.6.1
          pip install torch_scatter==2.1.2 torch_sparse==0.6.18 torch_cluster==1.6.3 -f https://data.pyg.org/whl/torch-2.6.0+cpu.html
          pip install absl-py==2.1.0 numpy==2.2.3 dm-tree==0.1.9 matplotlib==3.10.1 pyevtk==1.6.0 pytest==8.3.5 tqdm==4.67.1 toml==0.10.2
      - name: Fast tier
        run: pytest test/ -m "not slow" -q
      - name: Full CI tier (paper-parity gate is opt-in and skipped here)
        run: pytest test/ -q
