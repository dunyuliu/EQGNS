name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU torch + PyG
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric==2.6.1
          pip install torch_scatter torch_sparse torch_cluster -f https://data.pyg.org/whl/torch-2.6.0+cpu.html
          pip install absl-py numpy dm-tree matplotlib pyevtk pytest tqdm toml
      - name: Fast tier
        run: pytest test/ -m "not slow" -q
      - name: Full CI tier (paper-parity gate is opt-in and skipped here)
        run: pytest test/ -q
